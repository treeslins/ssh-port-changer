name: Shell Check

on:
  push:
    branches:
      - main
    paths:
      - 'ssh-port'
      - 'ssh-port-en'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    paths:
      - 'ssh-port'
      - 'ssh-port-en'
      - '.github/workflows/shellcheck.yml'

permissions:
  contents: read

jobs:
  shellcheck:
    name: Bash syntax and ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check Chinese edition
        run: |
          bash -n ssh-port
          shellcheck ssh-port

      - name: Check English edition
        run: |
          bash -n ssh-port-en
          shellcheck ssh-port-en
